# sflow 状态回执（schema v1）——约定见 core.md 第 11 节
#
# 只追加、不改写；大阶段由工件推导，不写在此文件。
# 每条回执写成单行 flow mapping，便于机械解析。
# 时间取系统当前时间，格式 ISO 8601 带时区。
#
# ⚠ 追加回执时：写在 receipts 区块内（缩进两格），不得追加到文件末尾——
#   counters 区块在 receipts 之后，追加到文件尾会被解析器归入 counters 块并报错。
#   正确做法：在最后一条回执行之后、counters 行之前插入新行。

schema: sflow-state/v1
change: <change-name>

baseline:
  # 首次 DP-2 批准时写入 git rev-parse HEAD 的结果；只写一次，重新桥接也不得改写。
  review_base: null

receipts:
  # 回执追加在此处（缩进两格），不要追加到文件末尾——counters 在后面。
  # 初始为空；首条回执由 /sflow-propose（DP-1）或 /sflow-start（路径选择）写入。
  # 示例（按实际事件追加，不要照抄）：
  # - { at: 2026-10-23T10:12:00+08:00, cmd: /sflow-start,   event: path.selected, path: full }
  # - { at: 2026-10-23T10:12:00+08:00, cmd: /sflow-propose,  event: dp1.approved }
  #   DP-1 条件化跳过（简单 full，core.md 第 2 节）时改记：
  # - { at: 2026-10-23T10:12:00+08:00, cmd: /sflow-propose,  event: dp1.skipped, reason: <一句话判定理由> }
  # - { at: 2026-10-23T14:03:00+08:00, cmd: /sflow-contract, event: dp2.approved, review_base: 9f2c1ab, fingerprints: { artifacts: { "proposal.md": <sha>, "design.md": <sha> }, tasks: <sha>, contract: <sha> } }
  #   （sflow guard --emit-fingerprints 可直接生成上一行，勿手抄哈希）
  # - { at: 2026-10-23T16:40:00+08:00, cmd: /sflow-apply,    event: batch.1.done, files: [src/a.ts], verification: passed }
  #   git_discipline: on 时额外记录提交 sha：
  # - { at: 2026-10-23T16:40:00+08:00, cmd: /sflow-apply,    event: batch.1.done, files: [src/a.ts], verification: passed, commit: a1b2c3d }
  # - { at: 2026-10-23T17:20:00+08:00, cmd: /sflow-debug,    event: debug.attempt.1, hypothesis: <一句话假设>, result: failed }
  #   修复成功：
  # - { at: 2026-10-23T17:40:00+08:00, cmd: /sflow-debug,    event: debug.resolved }
  # - { at: 2026-10-23T18:00:00+08:00, cmd: /sflow-verify,   event: verify.passed }
  #   或：
  # - { at: 2026-10-23T18:00:00+08:00, cmd: /sflow-verify,   event: verify.failed, failed: <命令> }
  # - { at: 2026-10-23T18:20:00+08:00, cmd: /sflow-review,   event: review.passed, counts: { critical: 0, important: 2, minor: 5 } }
  #   或审查有阻塞：
  # - { at: 2026-10-23T18:20:00+08:00, cmd: /sflow-review,   event: review.blocked, counts: { critical: 1, important: 2, minor: 5 } }
  #   归档直通合并（core.md 第 14 节）时，archive.done 之前多一条：
  # - { at: 2026-10-23T18:28:00+08:00, cmd: /sflow-archive,  event: archive.direct, basis: [only-added, no-title-collision, main-exists] }
  # - { at: 2026-10-23T18:30:00+08:00, cmd: /sflow-archive,  event: archive.done }

counters:
  debug_attempts: 0
